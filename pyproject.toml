[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wwm-midi-player"
version = "2.0.0"
description = "A simple application for playing MIDI files in WWM"
readme = "README.md"
# Capped below 3.14: pyaudio (a transitive dependency via tinysoundfont) has no
# official prebuilt Windows wheel for 3.14 yet, and building it from source
# requires a vcpkg-provided portaudio.
requires-python = ">=3.11,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "KrapFey" }
]
keywords = [
    "WWM",
    "MIDI",
    "Player",
    "Music",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "mido>=1.3.3",
    "keyboard>=0.13.5",
    "tinysoundfont>=0.3.7",
    "pywin32>=311",
    "pywebview>=6.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.2",
    "pre-commit>=4.5.1",
    "pyinstaller>=6.18.0",
    "pytest>=8.3.0",
]
all = [
    "wwm-midi-player[dev]"
]

[project.scripts]
wwm-player = "web_app:main"

[project.urls]
Repository = "https://github.com/KrapFey/wwm-midi-player"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "D",    # pydocstyle
    "F",    # pyflakes
    "UP",   # pyupgrade
    "N",    # PEP8-naming
    "I",    # isort
    "A",    # flake8-builtins
    "G",    # flake8-logging-format
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "SLF",  # flake8-self
    "ARG",  # flake8-unused-arguments
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import conventions
    "COM",  # flake8-commas
    "RSE",  # flake8-raise
    "INT",  # flake8-gettext
    "NPY",  # NumPy-specific rules
]
ignore = [
    "G004", # Logging statement uses f-string
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["utils", "web"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
